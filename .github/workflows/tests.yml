name: Tests

# The offline suite is safe to run anywhere: pytest defaults to
# `-m 'not integration'` (pyproject.toml), so no job here touches an FDSN
# Datacenter. Live tests stay opt-in and are never run in CI, to avoid putting
# load on third-party services on every push.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, plus the versions it must keep
        # working on. Keep this list and `requires-python` in sync.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (locked)
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Offline tests (unit + protocol)
        run: uv run pytest -q
