description:
  en:
    shortDescription: >-
      MCP server exposing FDSN Web Service Station metadata (networks,
      stations, channels, instrument responses) of any FDSN datacenter.
    documentation: "https://github.com/INGV/mcp-fdsnws-station/blob/main/README.md"
    longDescription: >
      An MCP (Model Context Protocol) server for the FDSN Web Service Station API (fdsnws-station 1.1). It exposes network, station, channel and instrument-response metadata of any FDSN-compliant datacenter (INGV, EarthScope, GFZ, ORFEUS, or a private service configured by name) to MCP clients such as Claude Desktop and Open WebUI.

      The server runs on the mcp 2.x SDK, speaks stdio by default and Streamable HTTP on request, and returns typed objects with a real output schema. Results are sorted and paginated by the server with an exact total count, so a query never floods the client's context.
    localisedName: "FDSNWS Station MCP Server"
    features:
      - FDSN Web Service Station query (network, station, channel levels)
      - Instrument response from StationXML through ObsPy
      - Multi-datacenter access by name, including private intranet services
      - Model Context Protocol (MCP) server, stdio and Streamable HTTP
